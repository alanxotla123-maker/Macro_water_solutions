<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos | Aqua Clean Pro</title>
    <link rel="stylesheet" href="index.css">

    <link rel="stylesheet" href="productos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">
        <img src="imagenes/logo.png" alt="Logo" class="logo-img">
        Aqua <span class="pro">Clean Pro</span>
    </div>


    <nav>
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>
    </nav>
    <div id="contenedorModal"></div>
    <div class="icons">
        <i class="fas fa-magnifying-glass"></i>
        <i class="fas fa-shopping-cart" id="iconCarrito"></i>
       <i class="fa-solid fa-user" id="iconLogin"></i>
    </div>
</header>
<section class="productos-section">

    <h2 class="productos-titulo">Nuestros Productos</h2>

    <div class="productos-grid">

        <div class="producto-card">
            <img src="imagenes/producto1.jpg">
            <div class="producto-info">
                <div class="producto-top">
                    <h3>AquaBot X200</h3>
                    <span class="precio">$899</span>
                </div>
                <p>Limpieza automatizada inteligente</p>
                <button class="btn-carrito">Añadir al carrito</button>
            </div>
        </div>

    </div>
<script src="carrito.js"></script>
<script src="login.js"></script>
</section>
</body>
</html>
