<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aqua Clean Pro</title>
    <link rel="stylesheet" href="index.css">

    <!-- FONT AWESOME CDN REAL -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
    <div class="logo">Aqua <span class="pro">Clean Pro</span></div>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Productos</a>
        <a href="#">Contacto</a>
    </nav>

    <div class="icons">
        <i class="fas fa-magnifying-glass"></i>
        <i class="fas fa-user" id="btnLogin"></i>
        <i class="fas fa-shopping-cart"></i>
    </div>
</header>

<section class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
        <h1>La mejor limpieza para tu <span class="highlight">hogar</span></h1>
        <p>Soluciones profesionales para mantener tu espacio impecable.</p>

        <div class="buttons">
            <a href="#" class="btn primary">Comprar ahora</a>
            <a href="#" class="btn secondary">Ver más</a>
        </div>
    </div>
</section>
<!-- MODAL LOGIN PRO -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <span class="cerrar" onclick="cerrarModal()">×</span>

    <h2>Iniciar Sesión</h2>
    <p class="subtitle">Accede para gestionar tus compras.</p>

    <form class="login-form">

      <label>Correo Electrónico</label>
      <input type="email" placeholder="ejemplo@gmail.com" required>

      <label>Contraseña</label>
      <input type="password" placeholder="**********" required>

      <button type="submit" class="login-btn">Entrar</button>

      <div class="divider">
        <span>O continúa con</span>
      </div>

      <button type="button" class="google-btn">
        <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" width="18">
        Google
      </button>

      <p class="register-text">
        ¿No tienes cuenta? <a href="#">Regístrate</a>
      </p>

    </form>
  </div>
</div>


<script>
const btnLogin = document.getElementById("btnLogin");
const modal = document.getElementById("modal");

btnLogin.addEventListener("click", function() {
    modal.classList.add("active");
});

function cerrarModal() {
    modal.classList.remove("active");
}
</script>

</body>
</html>
